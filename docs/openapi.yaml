openapi: "3.0.3"
info:
  title: Vega API
  description: REST API for Vega, an AI agent orchestration framework.
  version: "1.0.0"
servers:
  - url: https://your-vega.example.com
    description: Production

paths:
  # ── Company ───────────────────────────────────────────────────────────
  /api/v1/company:
    get:
      tags: [Company]
      summary: Get company identity
      description: Returns the company name, logo, accent colour, and sibling instances.
      operationId: getCompany
      responses:
        "200":
          description: Company info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"

  # ── Processes ─────────────────────────────────────────────────────────
  /api/v1/processes:
    get:
      tags: [Processes]
      summary: List all processes
      operationId: listProcesses
      responses:
        "200":
          description: Array of running and completed processes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcessResponse"

  /api/v1/processes/{id}:
    get:
      tags: [Processes]
      summary: Get process detail
      operationId: getProcess
      parameters:
        - $ref: "#/components/parameters/ProcessId"
      responses:
        "200":
          description: Process detail with conversation messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Processes]
      summary: Kill a process
      operationId: killProcess
      parameters:
        - $ref: "#/components/parameters/ProcessId"
      responses:
        "200":
          description: Process killed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Agents ────────────────────────────────────────────────────────────
  /api/v1/agents:
    get:
      tags: [Agents]
      summary: List all agents
      operationId: listAgents
      responses:
        "200":
          description: Array of agent definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentResponse"
    post:
      tags: [Agents]
      summary: Create (compose) a new agent
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAgentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Agent name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/agents/{name}:
    get:
      tags: [Agents]
      summary: Get a single agent by name
      description: |
        Returns the same shape as a single element of GET /api/v1/agents,
        but in one round-trip (collapses the list-then-find pattern in
        clients building agent detail pages).

        Hidden agents (the builder meta-agent and per-user clones using the
        "base:suffix" form) return 404 — same as unknown names — so the
        endpoint cannot be used to probe for internal agents.
      operationId: getAgent
      parameters:
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Agents]
      summary: Update an agent (composed or YAML-defined)
      description: |
        Updates the named agent. Works on both API-composed agents and
        YAML-defined agents — the latter are silently promoted to a
        composed override on first edit (the YAML remains as the
        conceptual base; edits layer on top in storage).

        404 fires only when the name is unknown to *both* the composed
        store and the YAML document. The builder meta-agent is
        protected (403) regardless.
      operationId: updateAgent
      parameters:
        - $ref: "#/components/parameters/AgentName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentRequest"
      responses:
        "200":
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "403":
          description: Forbidden (e.g. Hera cannot be updated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Agents]
      summary: Delete an agent
      operationId: deleteAgent
      parameters:
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Agent deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "403":
          description: Forbidden (e.g. Hera cannot be deleted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agents/{name}/template:
    get:
      tags: [Agents]
      summary: Export agent as portable template
      operationId: exportTemplate
      parameters:
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Portable agent template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTemplateResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agents/import:
    post:
      tags: [Agents]
      summary: Import an agent from a template
      operationId: importTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTemplateResponse"
      responses:
        "201":
          description: Agent created from template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAgentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Agent name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Chat ──────────────────────────────────────────────────────────────
  /api/v1/agents/{name}/chat:
    get:
      tags: [Chat]
      summary: Get chat history
      operationId: getChatHistory
      parameters:
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Array of chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      tags: [Chat]
      summary: Send a message (non-streaming)
      operationId: chat
      parameters:
        - $ref: "#/components/parameters/AgentName"
        - $ref: "#/components/parameters/XAuthUser"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Agent response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Chat]
      summary: Clear chat history and reset agent
      operationId: clearChat
      parameters:
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Chat cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /api/v1/agents/{name}/chat/stream:
    post:
      tags: [Chat]
      summary: Send a message (streaming via SSE)
      description: |
        Sends a message to the agent and returns a Server-Sent Events stream.
        Events use the `event:` field for type and `data:` for JSON payload.

        Event types: `text_delta`, `tool_start`, `tool_end`, `error`, `done`.

        The stream survives client disconnect -- use the GET reconnect endpoint to resume.
      operationId: chatStream
      parameters:
        - $ref: "#/components/parameters/AgentName"
        - $ref: "#/components/parameters/XAuthUser"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      tags: [Chat]
      summary: Reconnect to an in-progress stream
      description: |
        Always returns SSE. If the agent has an active stream, replays
        all buffered events then continues live. If no active stream,
        emits a single `no_active_stream` event followed by `done` and
        closes. Callers can run one SSE code path for both cases —
        no content-type heuristic.

        (BREAKING CHANGE in 0.2.0 — previously returned a JSON
        `{"streaming": false}` body when no stream was active.)
      operationId: chatStreamReconnect
      parameters:
        - $ref: "#/components/parameters/AgentName"
        - $ref: "#/components/parameters/XAuthUser"
      responses:
        "200":
          description: SSE event stream

  /api/v1/agents/{name}/chat/status:
    get:
      tags: [Chat]
      summary: Check if agent has an active stream
      operationId: chatStatus
      parameters:
        - $ref: "#/components/parameters/AgentName"
      responses:
        "200":
          description: Streaming status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatStatusResponse"

  # ── Memory ────────────────────────────────────────────────────────────
  /api/v1/agents/{name}/memory:
    get:
      tags: [Memory]
      summary: Get agent memory for a user
      operationId: getMemory
      parameters:
        - $ref: "#/components/parameters/AgentName"
        - name: user
          in: query
          schema:
            type: string
          description: User ID (defaults to X-Auth-User header or "default")
      responses:
        "200":
          description: Memory layers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryResponse"
    delete:
      tags: [Memory]
      summary: Delete agent memory for a user
      operationId: deleteMemory
      parameters:
        - $ref: "#/components/parameters/AgentName"
        - name: user
          in: query
          schema:
            type: string
          description: User ID (defaults to X-Auth-User header or "default")
      responses:
        "200":
          description: Memory deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  # ── Workflows ─────────────────────────────────────────────────────────
  /api/v1/workflows:
    get:
      tags: [Workflows]
      summary: List defined workflows
      operationId: listWorkflows
      responses:
        "200":
          description: Array of workflow definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowResponse"

  /api/v1/workflows/{name}/run:
    post:
      tags: [Workflows]
      summary: Run a workflow
      operationId: runWorkflow
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowRunRequest"
      responses:
        "202":
          description: Workflow launched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRunResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── MCP Servers ───────────────────────────────────────────────────────
  /api/v1/mcp/servers:
    get:
      tags: [MCP]
      summary: List connected MCP servers
      operationId: listMCPServers
      responses:
        "200":
          description: Array of MCP server statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MCPServerResponse"
    post:
      tags: [MCP]
      summary: Connect an MCP server
      operationId: connectMCPServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectMCPRequest"
      responses:
        "200":
          description: Server connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectMCPResponse"
        "409":
          description: Server already connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Connection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectMCPResponse"

  /api/v1/mcp/registry:
    get:
      tags: [MCP]
      summary: List MCP registry entries
      operationId: listMCPRegistry
      responses:
        "200":
          description: Array of available MCP integrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MCPRegistryEntryResponse"

  /api/v1/mcp/servers/{name}:
    put:
      tags: [MCP]
      summary: Update an MCP server (disconnect, update config, reconnect)
      operationId: updateMCPServer
      parameters:
        - $ref: "#/components/parameters/MCPServerName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectMCPRequest"
      responses:
        "200":
          description: Server updated and reconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectMCPResponse"
        "502":
          description: Reconnect failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectMCPResponse"
    delete:
      tags: [MCP]
      summary: Disconnect and remove an MCP server
      operationId: disconnectMCPServer
      parameters:
        - $ref: "#/components/parameters/MCPServerName"
      responses:
        "200":
          description: Server disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/mcp/servers/{name}/config:
    get:
      tags: [MCP]
      summary: Get persisted MCP server config
      operationId: getMCPServerConfig
      parameters:
        - $ref: "#/components/parameters/MCPServerName"
      responses:
        "200":
          description: Server configuration (suitable for pre-filling edit forms)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServerConfigResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/mcp/servers/{name}/refresh:
    post:
      tags: [MCP]
      summary: Refresh an MCP server (disconnect and reconnect)
      operationId: refreshMCPServer
      parameters:
        - $ref: "#/components/parameters/MCPServerName"
      responses:
        "200":
          description: Server refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectMCPResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Reconnect failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectMCPResponse"

  /api/v1/mcp/servers/{name}/duplicate:
    post:
      tags: [MCP]
      summary: Duplicate an MCP server with a new name
      operationId: duplicateMCPServer
      parameters:
        - $ref: "#/components/parameters/MCPServerName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_name]
              properties:
                new_name:
                  type: string
      responses:
        "200":
          description: Server duplicated and connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectMCPResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: New name already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/mcp/servers/{name}/disable:
    put:
      tags: [MCP]
      summary: Enable or disable an MCP server
      operationId: toggleMCPServer
      parameters:
        - $ref: "#/components/parameters/MCPServerName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              properties:
                disabled:
                  type: boolean
      responses:
        "200":
          description: Server toggled
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StatusResponse"
                  - $ref: "#/components/schemas/ConnectMCPResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Stats & Spawn Tree ────────────────────────────────────────────────
  /api/v1/stats:
    get:
      tags: [System]
      summary: Get aggregate system stats
      operationId: getStats
      responses:
        "200":
          description: System statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"

  /api/v1/spawn-tree:
    get:
      tags: [System]
      summary: Get process spawn tree
      operationId: getSpawnTree
      responses:
        "200":
          description: Hierarchical spawn tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpawnTreeNodeResponse"

  # ── Population ────────────────────────────────────────────────────────
  /api/v1/population/search:
    get:
      tags: [Population]
      summary: Search the population registry
      operationId: populationSearch
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query
        - name: kind
          in: query
          schema:
            type: string
            enum: [persona, skill, profile]
          description: Filter by item kind
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PopulationSearchResult"

  /api/v1/population/info/{kind}/{name}:
    get:
      tags: [Population]
      summary: Get detailed info about a population item
      operationId: populationInfo
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [persona, skill, profile]
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Item details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PopulationInfoResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/population/install:
    post:
      tags: [Population]
      summary: Install a population item
      operationId: populationInstall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PopulationInstallRequest"
      responses:
        "200":
          description: Item installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/population/installed:
    get:
      tags: [Population]
      summary: List installed population items
      operationId: populationInstalled
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [persona, skill, profile]
          description: Filter by item kind
      responses:
        "200":
          description: Installed items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PopulationInstalledItem"

  # ── Channels ──────────────────────────────────────────────────────────
  /api/v1/channels:
    get:
      tags: [Channels]
      summary: List all channels
      operationId: listChannels
      responses:
        "200":
          description: Array of channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
    post:
      tags: [Channels]
      summary: Create a channel
      operationId: createChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "201":
          description: Channel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/channels/{name}:
    get:
      tags: [Channels]
      summary: Get a channel by name
      operationId: getChannel
      parameters:
        - $ref: "#/components/parameters/ChannelName"
      responses:
        "200":
          description: Channel details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Channels]
      summary: Partially update a channel's display fields (name, description)
      description: |
        Use this for renaming and editing description. Team-member
        updates go through `PUT /channels/{name}/team` (separate endpoint
        because team changes have downstream implications — channel
        membership affects delegation and chat routing).
      operationId: updateChannel
      parameters:
        - $ref: "#/components/parameters/ChannelName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelRequest"
      responses:
        "200":
          description: Channel updated (returns the post-update Channel)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Channels]
      summary: Delete a channel
      operationId: deleteChannel
      parameters:
        - $ref: "#/components/parameters/ChannelName"
      responses:
        "200":
          description: Channel deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/channels/{name}/team:
    put:
      tags: [Channels]
      summary: Update channel team members
      operationId: updateChannelTeam
      parameters:
        - $ref: "#/components/parameters/ChannelName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team]
              properties:
                team:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Team updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/channels/{name}/messages:
    get:
      tags: [Channels]
      summary: List channel messages
      operationId: listChannelMessages
      parameters:
        - $ref: "#/components/parameters/ChannelName"
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
          description: Max messages to return
      responses:
        "200":
          description: Array of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelMessage"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Channels]
      summary: Post a message to a channel (non-streaming)
      operationId: channelPost
      parameters:
        - $ref: "#/components/parameters/ChannelName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelPostRequest"
      responses:
        "200":
          description: Message posted; agent response is async
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id:
                    type: integer
                    format: int64
                  thread_id:
                    type: integer
                    format: int64
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/channels/{name}/messages/{id}/thread:
    get:
      tags: [Channels]
      summary: List thread replies for a message
      operationId: listThreadMessages
      parameters:
        - $ref: "#/components/parameters/ChannelName"
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Parent message ID
      responses:
        "200":
          description: Array of thread messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelMessage"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/channels/{name}/stream:
    post:
      tags: [Channels]
      summary: Post a message and stream agent responses via SSE
      description: |
        Posts a user message, then returns an SSE stream of channel events.
        Event types: `channel.message`, `channel.typing`, `channel.text_delta`,
        `channel.tool_start`, `channel.tool_end`, `channel.thread_reply`,
        `channel.error`, `channel.done`.
      operationId: channelStream
      parameters:
        - $ref: "#/components/parameters/ChannelName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelPostRequest"
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChannelEvent"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [Channels]
      summary: Reconnect to a channel stream
      operationId: channelStreamReconnect
      parameters:
        - $ref: "#/components/parameters/ChannelName"
      responses:
        "200":
          description: SSE event stream (replays buffered events first)
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChannelEvent"

  # ── Files ─────────────────────────────────────────────────────────────
