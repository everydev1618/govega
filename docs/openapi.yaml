      operationId: listTasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: CSV of statuses to include — todo,doing,blocked,done,canceled
        - name: assignee
          in: query
          schema:
            type: string
          description: CSV of agent names to filter by
        - name: tag
          in: query
          schema:
            type: string
          description: CSV of tags; matches if a task has any of them
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Array of tasks (newest-updated first)
          content:
            application/json:
              schema:
                type: array
