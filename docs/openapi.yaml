          $ref: "#/components/responses/BadRequest"

  /api/v1/prompt-history/{id}:
    delete:
      tags: [Prompt History]
      summary: Delete a prompt history entry
      operationId: deletePromptHistory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Entry deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Reset ─────────────────────────────────────────────────────────────
  /api/v1/reset:
    post:
      tags: [System]
      summary: Full system reset
      description: |
        Kills all processes, disconnects MCP servers, clears database tables
        (except prompt_history), and removes all workspace files.
      operationId: reset
      responses:
        "200":
          description: Reset complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  # ── SSE Events ────────────────────────────────────────────────────────
  /api/v1/events:
    get:
      tags: [System]
      summary: Global SSE event stream
      description: |
        Server-Sent Events stream for real-time orchestration updates.
        Events include process lifecycle, agent status, workflow completions, etc.
        Sends a heartbeat comment every 30 seconds.

        Notable event types:
          * `agent.created` — agent persisted and ready (terminal).
          * `agent.deleted` — agent removed.
          * `agent.provisioning` — fired during create_agent so FEs can
            render placeholder cards (refs govega#56). `data.phase` is
            one of:
              - `started` — earliest signal, only `agent` is known.
              - `field_set` — `data` carries the full agent snapshot
                (display_name, title, description, avatar, icon,
                avatar_gradient, model, team).
              - `ready` — process spawned; persistence may not have
                landed yet (use `agent.created` for terminal state).
              - `failed` — provisioning aborted; `data.error` carries
                the message. FEs should clear the placeholder.
      operationId: sseEvents
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/BrokerEvent"
        "503":
          description: Too many subscribers

  # ── Identity / Config ─────────────────────────────────────────────────
  /api/v1/identity:
    get:
      tags: [System]
      summary: Get orchestrator/builder identities + product name
      operationId: getIdentity
      responses:
        "200":
          description: Identity info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponse"

  /api/v1/tenant/config:
    get:
      tags: [System]
      summary: Get unified tenant config (orchestrator identity + branding)
      description: |
        Single shape for the customer's runtime-editable identity. Reads
        the live orchestrator slug/display/title (already overridden at
        boot from the settings table per govega#58) plus branding fields
        (accent_color, logo_url) directly from settings. Refs govega#32
        item B.
      operationId: getTenantConfig
      responses:
        "200":
          description: Tenant config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantConfigResponse"
    put:
      tags: [System]
      summary: Update tenant config (partial)
      description: |
        Omitted fields stay. Orchestrator identity changes flow through
        the same rename machinery as
        PUT /api/v1/agents/{name} on the orchestrator slug — settings
        written, cfg mutated in-place, Iris re-injected under the new
        identity. Branding changes just persist as settings. Either
        side fires a `tenant.config_changed` SSE event so the SPA
        refetches identity. Refs govega#32 item B.

        Will become admin-only when auth lands (#32 item A); open for now.
      operationId: updateTenantConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantConfigRequest"
      responses:
        "200":
          description: Updated tenant config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantConfigResponse"
        "409":
          description: Orchestrator slug conflicts with builder.

  /api/v1/config:
    get:
      tags: [System]
      summary: Get the running configuration (agents, MCP servers, settings)
      operationId: getConfig
      responses:
        "200":
          description: Current config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"

  /api/v1/config/upload:
    post:
      tags: [System]
      summary: Upload a .vega.yaml file and apply its agents + MCP servers
      operationId: uploadConfig
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: A .vega.yaml or .vega.yml file (max 2MB)
      responses:
        "200":
          description: Apply result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigUploadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          description: Invalid YAML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Chat read receipts ────────────────────────────────────────────────
  /api/v1/chat/unread:
    get:
      tags: [Chat]
      summary: Unread message counts per agent (DM)
      operationId: chatUnreadCounts
      parameters:
        - $ref: "#/components/parameters/XAuthUser"
      responses:
        "200":
          description: Map of agent name → unread count
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer

  /api/v1/agents/{name}/chat/read:
    post:
      tags: [Chat]
      summary: Mark all DM messages from an agent as read
      operationId: markChatRead
      parameters:
        - $ref: "#/components/parameters/AgentName"
        - $ref: "#/components/parameters/XAuthUser"
      responses:
        "200":
          description: Marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /api/v1/channels/{name}/read:
    post:
      tags: [Channels]
      summary: Mark all messages in a channel as read
      operationId: markChannelRead
      parameters:
        - $ref: "#/components/parameters/ChannelName"
        - $ref: "#/components/parameters/XAuthUser"
      responses:
        "200":
          description: Marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Integrations: Telegram ────────────────────────────────────────────
  /api/v1/integrations/telegram:
    get:
      tags: [Integrations]
      summary: List configured Telegram bots (no tokens)
      operationId: listTelegramBots
      responses:
        "200":
          description: Bots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TelegramBotStatus"
    post:
      tags: [Integrations]
      summary: Add or replace a Telegram bot
      operationId: configureTelegramBot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramConfigureRequest"
      responses:
        "200":
          description: Updated bot list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TelegramBotStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          description: Telegram API error

  /api/v1/integrations/telegram/{id}:
    delete:
      tags: [Integrations]
      summary: Stop and drop a Telegram bot by id
      operationId: removeTelegramBot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Bot id (numeric prefix of the bot token)
      responses:
        "200":
          description: Updated bot list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TelegramBotStatus"

  # ── Integrations: Gmail ───────────────────────────────────────────────
  /api/v1/integrations/gmail:
    get:
      tags: [Integrations]
      summary: Gmail connection status (no secrets)
      operationId: getGmailStatus
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailStatus"
    post:
      tags: [Integrations]
      summary: Manual paste — store Client ID + Client Secret + Refresh Token
      description: |
        Self-hosted operators bring their own OAuth client. For cloud-mode
        end users, prefer POST /api/v1/integrations/gmail/start which mediates
        through the control plane's shared OAuth client.
      operationId: configureGmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GmailConfigureRequest"
      responses:
        "200":
          description: Status (post-config)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          description: Failed to connect Gmail MCP server with given creds
    delete:
      tags: [Integrations]
      summary: Disconnect Gmail and remove stored credentials
      operationId: disableGmail
      responses:
        "200":
          description: Status (post-disconnect)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailStatus"

  /api/v1/integrations/gmail/start:
    post:
      tags: [Integrations]
      summary: Cloud-mode initiate — proxy to control plane's /oauth/gmail/init
      description: |
        Returns Google's authorize URL. The SPA navigates to it; after
        Google authorization the control plane redirects the browser back
        to <return>?gmail_handoff=<jwt> which the SPA passes to
        POST /api/v1/integrations/gmail/handoff.

        Returns 503 when the tenant has no APEX_CONTROL_PLANE_URL configured;
        callers should fall back to the manual paste flow (POST /api/v1/integrations/gmail).
      operationId: startGmailConnect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [return]
              properties:
                return:
                  type: string
                  format: uri
                  description: URL to redirect the user to after Google auth completes
      responses:
        "200":
          description: Authorize URL
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url]
                properties:
                  authorize_url:
                    type: string
                    format: uri
        "503":
          description: Cloud-mode Gmail OAuth not configured on this tenant
        "502":
          description: Control plane unreachable

  /api/v1/integrations/gmail/handoff:
    post:
      tags: [Integrations]
      summary: Cloud-mode complete — consume a control-plane handoff JWT
      description: |
        Validates a 60-second JWT signed by the control plane (purpose=gmail-handoff,
        aud=this tenant, sub=authenticated user, jti for replay protection),
        persists the embedded refresh token to settings, and exports
        GMAIL_REFRESH_TOKEN. The SPA invokes this when it lands at a URL
        containing ?gmail_handoff=<jwt> after the OAuth round-trip.
      operationId: consumeGmailHandoff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handoff_token]
              properties:
                handoff_token:
                  type: string
                  description: Control-plane-signed JWT, purpose=gmail-handoff
      responses:
        "200":
          description: Persisted
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
        "400":
          description: Invalid handoff (bad signature, expired, wrong purpose, replay, missing refresh token)
        "403":
          description: Handoff sub does not match authenticated user

  # ── Integrations: brokered catalog (Composio under the hood) ─────────
  # Generic third-party app connections (Slack, GitHub, Jira, …) brokered
  # by the tenant backend over a connectivity provider (Composio). The
  # contract is provider-agnostic: tenants never see or hold a provider
  # key. Multi-account: a toolkit can hold any number of connections
  # (e.g. two GitHub accounts) — each is one provider-side connected
  # account and, once active, one MCP server self-connected through
  # /api/v1/mcp/servers (named composio-<toolkit>[-n] to avoid the MCP
  # registry's builtin names; account_label flows through to the
  # per-agent tool surface). Bespoke integrations (telegram, gmail above)
  # keep their concrete paths; {toolkit} here never shadows them because
  # the connections sub-collection adds a path segment they don't use.
  /api/v1/integrations:
    get:
      tags: [Integrations]
      summary: List the integration catalog with connections
      operationId: listIntegrations
      responses:
        "200":
          description: Catalog of available integrations, each carrying this workspace's connected accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationResponse"

  /api/v1/integrations/{toolkit}/connections:
    post:
      tags: [Integrations]
      summary: Start the OAuth consent flow for a new account
      description: |
        Creates a NEW connection on this toolkit — always allowed, even
        when other accounts are already connected. Asks the connectivity
        provider for a hosted consent link (Composio:
        POST /api/v3/connected_accounts/link) and returns it. The SPA
        navigates the browser to redirect_url; after consent the provider
        sends the user back to callback_url with
        ?connected=<toolkit>&status=success|denied appended. The
        connection is `pending` until the round-trip completes.
      operationId: connectIntegration
      parameters:
        - $ref: "#/components/parameters/IntegrationToolkit"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectIntegrationRequest"
      responses:
        "200":
          description: Consent flow started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectIntegrationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Connectivity provider error

  /api/v1/integrations/{toolkit}/connections/{connection_id}:
    delete:
      tags: [Integrations]
      summary: Disconnect one account
      description: |
        Deletes the provider-side connected account and removes that
        connection's MCP server from /api/v1/mcp/servers. Other accounts
        on the same toolkit are untouched. Idempotent.
      operationId: disconnectIntegration
      parameters:
        - $ref: "#/components/parameters/IntegrationToolkit"
        - $ref: "#/components/parameters/IntegrationConnectionId"
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

# ═══════════════════════════════════════════════════════════════════════
components:
  parameters:
    ProcessId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Process ID

    AgentName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Agent name

    ChannelName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Channel name

    MCPServerName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: MCP server name

    IntegrationToolkit:
      name: toolkit
      in: path
      required: true
      schema:
        type: string
      description: Integration toolkit slug (e.g. "slack", "github")

    IntegrationConnectionId:
      name: connection_id
      in: path
      required: true
      schema:
        type: string
      description: Connection id (provider connected-account id, e.g. "ca_…")

    XAuthUser:
      name: X-Auth-User
      in: header
      schema:
        type: string
      description: User identifier for per-user agent sessions and memory

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ── Generic ───────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details:
          type: string

    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

    # ── Company ───────────────────────────────────────────────────────
    CompanyResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        logo_url:
          type: string
        accent_color:
          type: string
        siblings:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              url:
                type: string
              icon:
                type: string

    # ── Processes ─────────────────────────────────────────────────────
    MetricsResponse:
      type: object
      properties:
        iterations:
          type: integer
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cost_usd:
          type: number
          format: double
        tool_calls:
          type: integer
        errors:
          type: integer
        last_active_at:
          type: string
          format: date-time

    ProcessResponse:
      type: object
      properties:
        id:
          type: string
        agent:
          type: string
        task:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, timeout]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        parent_id:
          type: string
        spawn_depth:
          type: integer
        spawn_reason:
          type: string
        metrics:
          $ref: "#/components/schemas/MetricsResponse"

    ProcessDetailResponse:
      allOf:
        - $ref: "#/components/schemas/ProcessResponse"
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/MessageResponse"

    MessageResponse:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string

    # ── Agents ────────────────────────────────────────────────────────
    AgentResponse:
      type: object
      properties:
        name:
          type: string
        display_name:
          type: string
        title:
          type: string
        description:
          type: string
          description: Short paragraph describing the agent's purpose. User-facing — distinct from `system` (the LLM-facing prompt).
        avatar:
          type: string
          description: Free-form avatar string (emoji, short code, etc.). Prefer `icon` + `avatar_gradient` for new code.
        icon:
          type: string
          description: Lucide icon name (e.g. "Sparkles", "Briefcase"). Pairs with `avatar_gradient` for the agent badge.
        avatar_gradient:
          type: array
          items:
            type: string
          description: Two-stop CSS color gradient as a hex pair, e.g. ["#EF4444", "#DC2626"].
        is_orchestrator:
          type: boolean
          description: |
            True when this agent is the tenant's configured orchestrator
            (the "main agent" — Iris by default, renamable per tenant via
            `cfg.Orchestrator.Name`). Frontends use this to render
            orchestrator-specific affordances (e.g. a "talk to your
            orchestrator" entry point) without hardcoding the name.
        is_builder:
          type: boolean
          description: |
            True when this agent is the tenant's configured builder
            (Hera by default; in Apex tenants this is always "Apex").
            Internal meta-agent — typically filtered out of public
            listings; flag is provided for symmetry with is_orchestrator
            when an integration path surfaces the builder.
        model:
          type: string
        system:
          type: string
        tools:
          type: array
          items:
            type: string
        team:
          type: array
          items:
            type: string
        process_id:
          type: string
        status:
          type: string
          enum: [idle, running, error, provisioning]
          description: |
            High-level agent lifecycle state. Always present.

            - `idle` — agent is defined but has no active work in flight
              (covers "never spawned," "pending spawn," and "completed
              last task")
            - `running` — process is actively working on a task right now
            - `error` — last terminal state was a failure or timeout
            - `provisioning` — RESERVED. Agent record exists but the
              underlying environment isn't ready to accept work yet
              (workspace setup, dependency install, MCP boot, first-run
              hooks). govega currently creates agents synchronously and
              **does not emit this value today** — the `POST /agents`
              response duration covers the provisioning window. Frontends
              should handle it now as a future-stable contract for when
              async creation lands.
        health:
          type: string
          enum: [unknown, healthy, degraded, unhealthy]
          description: |
            Orthogonal "is anything wrong?" signal, independent of
            lifecycle status. Always present.

            - `unknown` — no process or no signal yet
            - `healthy` — running or recently completed with zero errors
            - `degraded` — running or completed but errors > 0
            - `unhealthy` — last terminal state was failure or timeout
        streaming:
          type: boolean
          description: True if the agent (or any per-user clone of it) currently has an active chat stream.
        source:
          type: string
          description: '"composed" if created via API, absent if defined in YAML'
        created_at:
          type: string
          format: date-time
          description: When the agent was first persisted. Composed agents only — YAML agents omit this.
        updated_at:
          type: string
          format: date-time
          description: Last time the agent definition changed. Composed agents only.
        last_activity:
          type: string
          format: date-time
          description: Most recent moment the agent's running process did work (last token, last tool call). Omitted if the agent has never run.
        stats:
          $ref: "#/components/schemas/AgentStatsResponse"
        reports_to:
          type: array
          items:
            type: string
          description: |
            List of agents whose `team` includes this agent — i.e. the
            agent's supervisors. Inverse direction of `team` (forward
            delegation). Computed at request time from the document.

    AgentStatsResponse:
      type: object
      description: Per-agent kanban task counters. Aggregated from the tasks table at request time.
      required: [assigned_tasks, completed_tasks]
      properties:
        assigned_tasks:
          type: integer
          description: Count of tasks assigned to this agent that are not yet terminal (status in todo, doing, blocked).
        completed_tasks:
          type: integer
          description: Count of tasks this agent has marked done.
        success_rate:
          type: number
          format: double
          nullable: true
          description: |
            `completed / (completed + canceled)`. Null when there are no
            terminal tasks (denominator zero) — the frontend should render
            "—" rather than a misleading 0%.

    CreateAgentRequest:
      type: object
      required: [name, model]
      properties:
        name:
          type: string
        display_name:
          type: string
        title:
          type: string
        description:
          type: string
          description: Short paragraph describing the agent's purpose. See AgentResponse.description.
        avatar:
          type: string
        icon:
          type: string
          description: Lucide icon name. See AgentResponse.icon.
        avatar_gradient:
          type: array
          items:
            type: string
          description: Two-stop CSS color gradient. See AgentResponse.avatar_gradient.
        model:
          type: string
        persona:
          type: string
          description: Population persona name (loads system prompt from installed persona)
        skills:
          type: array
          items:
            type: string
          description: Population skill names to install tools from
        team:
          type: array
          items:
            type: string
          description: Agent names this agent can delegate to
        system:
          type: string
          description: System prompt (overrides persona if both provided)
        temperature:
          type: number
          format: double

    CreateAgentResponse:
      type: object
      properties:
        name:
          type: string
        model:
          type: string
        tools:
          type: array
          items:
            type: string
        process_id:
          type: string

    UpdateAgentRequest:
      type: object
      properties:
        name:
          type: string
          description: New name (for renaming)
        display_name:
          type: string
        title:
          type: string
        description:
          type: string
          description: New description. See AgentResponse.description.
        avatar:
          type: string
        icon:
          type: string
          description: Lucide icon name. See AgentResponse.icon.
        avatar_gradient:
          type: array
          items:
            type: string
          description: Two-stop CSS color gradient. See AgentResponse.avatar_gradient.
        model:
          type: string
        system:
          type: string
        team:
          type: array
          items:
            type: string
        temperature:
          type: number
          format: double

    AgentTemplateResponse:
      type: object
      properties:
        version:
          type: string
        name:
          type: string
        display_name:
          type: string
        title:
          type: string
        description:
          type: string
          description: See AgentResponse.description.
        avatar:
          type: string
        icon:
          type: string
        avatar_gradient:
          type: array
          items:
            type: string
        model:
          type: string
        system:
          type: string
        tools:
          type: array
          items:
            type: string
        team:
          type: array
          items:
            type: string
        exported_by:
          type: string
        exported_at:
          type: string
          format: date-time

    # ── Chat ──────────────────────────────────────────────────────────
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ToolActivity:
      type: object
      required: [tool_name]
      description: |
        A completed tool call captured during a streaming assistant turn.
        Stored alongside the final message so loading chat history
        reproduces the live tool-call timeline.
      properties:
        tool_call_id:
          type: string
        tool_name:
          type: string
        arguments:
          type: object
          additionalProperties: true
        result:
          type: string
        duration_ms:
          type: integer
          format: int64
        error:
          type: string

    ChatMessage:
      type: object
      required: [id, role, content, created_at]
      properties:
        id:
          type: integer
          format: int64
          description: |
            Stable, monotonically-increasing message id. Use this as the
            React key, for per-message addressing (edits, reactions,
            deep-links), and for ordering. Unique across the
            chat_messages table, not just within a single agent.
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        created_at:
          type: string
          format: date-time
          description: When the message was persisted (RFC 3339).
        tool_activities:
          type: array
          items:
            $ref: "#/components/schemas/ToolActivity"
          description: |
            Completed tool calls from the assistant turn that produced
            this message. Empty for user messages and for assistant
            messages that didn't invoke tools. Captured from the
            streaming events at persist time, so loading history shows
            the same tool timeline that was rendered live.

    ChatStatusResponse:
      type: object
      properties:
        streaming:
          type: boolean

    ChatEvent:
      type: object
      description: SSE event emitted during streaming chat
      properties:
        type:
          type: string
          enum: [text_delta, tool_start, tool_end, error, done]
        delta:
          type: string
          description: Text chunk (text_delta events)
        tool_call_id:
          type: string
        tool_name:
          type: string
        arguments:
          type: object
          additionalProperties: true
        result:
          type: string
        duration_ms:
          type: integer
          format: int64
        error:
          type: string
        nested_agent:
          type: string
        metrics:
          $ref: "#/components/schemas/ChatEventMetrics"

    ChatEventMetrics:
      type: object
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cost_usd:
          type: number
          format: double
        duration_ms:
          type: integer
          format: int64

    # ── Memory ────────────────────────────────────────────────────────
    MemoryLayer:
      type: string
      enum: [profile, topics, notes, journal]
      description: |
        A summary layer of an agent's persistent memory of a user.
        Layers are independent rows in `user_memory`; reading the agent's
        memory returns one row per layer.

        - `profile` — who the user is (role, expertise, preferences,
          stable facts). Rewritten async by the extractor after each
          user/assistant exchange.
        - `topics` — currently-active topics the user is working on.
          Rebuilt async from `notes` and recent exchanges; surfaces what
          the agent should treat as "live context" right now.
        - `notes` — significant moments and details worth remembering.
          The richest layer; appended to (not overwritten) by the
          extractor and by explicit `remember` tool calls.
        - `journal` — legacy/historical layer. Read-only on output, no
          new writes. Surfaced under the "History (legacy)" header in
          the agent's system prompt for backward compatibility with
          older deployments.

        Read order when injected into an agent's system prompt:
        profile → topics → journal → notes. Frontend UIs may render in
        any order; the enum is the source of truth for layer identity.

    MemoryResponse:
      type: object
      properties:
        user_id:
          type: string
        agent:
          type: string
        layers:
          type: array
          description: |
            All persisted memory rows for this user+agent pair, one per
            layer. Order is whatever the store returns; clients that need
            stable ordering should sort by `layer` or by `updated_at`.
          items:
            $ref: "#/components/schemas/UserMemory"

    UserMemory:
      type: object
      properties:
        user_id:
          type: string
        agent:
          type: string
        layer:
          $ref: "#/components/schemas/MemoryLayer"
        content:
          type: string
          description: |
            Layer payload. For `profile` and `topics`, this is JSON
            (a profile object / topics summary object). For `notes` and
            `journal`, this is markdown-ish prose. Frontends should treat
            the content as opaque for display unless they specifically
            understand the layer's shape.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Workflows ─────────────────────────────────────────────────────
    WorkflowResponse:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        steps:
          type: integer
        inputs:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/InputResponse"

    InputResponse:
      type: object
      properties:
        type:
          type: string
        description:
          type: string
        required:
          type: boolean
        default: {}
        enum:
          type: array
          items:
            type: string

    WorkflowRunRequest:
      type: object
      properties:
        inputs:
          type: object
          additionalProperties: true

    WorkflowRunResponse:
      type: object
      properties:
        run_id:
          type: string
        status:
          type: string
          example: running

    # ── MCP ───────────────────────────────────────────────────────────
    MCPServerResponse:
      type: object
      properties:
        name:
          type: string
        connected:
          type: boolean
        disabled:
          type: boolean
        transport:
          type: string
        url:
          type: string
        command:
          type: string
        tools:
          type: array
          items:
            type: string

    MCPRegistryEntryResponse:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        required_env:
          type: array
          items:
            type: string
        optional_env:
          type: array
          items:
            type: string
        builtin_go:
          type: boolean
        connected:
          type: boolean
        existing_settings:
          type: object
          additionalProperties:
            type: string
        icon:
          type: string
          description: |
            Lucide icon name for the FE integrations grid (refs govega#44).
        category:
          type: string
          description: |
            Integration grouping. Taxonomy: communication, dev_tools, crm,
            project_mgmt, cloud, data, productivity, web. Empty for
            uncategorized.

    ConnectMCPRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        env:
          type: object
          additionalProperties:
            type: string
        transport:
          type: string
          enum: [stdio, http, sse]
        command:
          type: string
        args:
          type: array
          items:
            type: string
        url:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        timeout:
          type: integer
          description: Timeout in seconds

    ConnectMCPResponse:
      type: object
      properties:
        name:
          type: string
        connected:
          type: boolean
        tools:
          type: array
          items:
            type: string
        error:
          type: string

    MCPServerConfigResponse:
      type: object
      properties:
        name:
          type: string
        transport:
          type: string
        command:
          type: string
        args:
          type: array
          items:
            type: string
        url:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        timeout:
          type: integer
        env_keys:
          type: array
          items:
            type: string
        existing_settings:
          type: object
          additionalProperties:
            type: string
        is_registry:
          type: boolean

    # ── Stats ─────────────────────────────────────────────────────────
    StatsResponse:
      type: object
      properties:
        total_processes:
          type: integer
        running_processes:
          type: integer
        completed_processes:
          type: integer
        failed_processes:
          type: integer
        total_input_tokens:
          type: integer
        total_output_tokens:
          type: integer
        total_cache_creation_tokens:
          type: integer
        total_cache_read_tokens:
          type: integer
        total_cost_usd:
          type: number
          format: double
        total_tool_calls:
          type: integer
        total_errors:
          type: integer
        uptime:
          type: string
          example: "2h15m30s"

    SpawnTreeNodeResponse:
      type: object
      properties:
        process_id:
          type: string
        agent_name:
          type: string
        task:
          type: string
        status:
          type: string
        spawn_depth:
          type: integer
        spawn_reason:
          type: string
        started_at:
          type: string
          format: date-time
        children:
          type: array
          items:
            $ref: "#/components/schemas/SpawnTreeNodeResponse"

    # ── Population ────────────────────────────────────────────────────
    PopulationSearchResult:
      type: object
      properties:
        kind:
          type: string
        name:
          type: string
        version:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        score:
          type: number
          format: double

    PopulationInfoResponse:
      type: object
      properties:
        kind:
          type: string
        name:
          type: string
        version:
          type: string
        description:
          type: string
        author:
          type: string
        tags:
          type: array
          items:
            type: string
        persona:
          type: string
        skills:
          type: array
          items:
            type: string
        recommended_skills:
          type: array
          items:
            type: string
        system_prompt:
          type: string
        installed:
          type: boolean
        installed_path:
          type: string

    PopulationInstalledItem:
      type: object
      properties:
        kind:
          type: string
        name:
          type: string
        version:
          type: string
        path:
          type: string

    PopulationInstallRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    # ── Channels ──────────────────────────────────────────────────────
    Channel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        team:
          type: array
          items:
            type: string
        mode:
          type: string
          enum: ["", social, reactive]
          description: |
            "" (default) — only the team lead responds to non-mentioned posts.
            "social" — every team member responds to every message.
            "reactive" — members respond when the message looks work-relevant.
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: When the channel's metadata (name, description, team) was last changed.
        message_count:
          type: integer

    ChannelMessage:
      type: object
      properties:
        id:
          type: integer
          format: int64
        channel_id:
          type: string
        thread_id:
          type: integer
          format: int64
        agent:
          type: string
        sender:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        metadata:
          type: string
        created_at:
          type: string
          format: date-time
        icon:
          type: string
          description: Lucide icon name echoed from the sending agent. Lets channel UIs render sender identity without a separate /api/v1/agents lookup.
        avatar_gradient:
          type: array
          items:
            type: string
          description: Echoed from the sending agent. See `icon`.
        reply_count:
          type: integer
          description: Number of replies in this thread (only set for top-level messages).
        latest_reply_at:
          type: string
          format: date-time
          description: Timestamp of the most recent reply (only set for top-level messages with replies).
        reply_senders:
          type: array
          items:
            type: string
          description: Distinct sender names across all replies in this thread. Useful for "X and Y replied" indicators.
        tool_activities:
          type: array
          items:
            $ref: "#/components/schemas/ToolActivity"
          description: |
            Completed tool calls from the assistant turn that produced
            this message. Same shape as ChatMessage.tool_activities.

    CreateChannelRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        team:
          type: array
          items:
            type: string
        mode:
          type: string
          enum: ["", social, reactive]
          description: Channel response mode. See Channel.mode.

    UpdateChannelRequest:
      type: object
      description: Partial update — omitted fields are left unchanged. Use `PUT /channels/{name}/team` for team-member updates.
      properties:
        name:
          type: string
          description: New name (for renaming)
        description:
          type: string

    ChannelPostRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
        thread_id:
          type: integer
          format: int64
          description: Post as a reply in this thread
        agent:
          type: string
          description: Target a specific agent (defaults to team lead)

    ChannelEvent:
      type: object
      description: |
        SSE event for channel activity. Tool-call fields are present on
        `channel.tool_start` / `channel.tool_end` events, mirroring
        ChatStreamEvent. On the reconnect endpoint, `no_active_stream`
        is emitted followed by `done` when there's nothing to resume —
        callers don't need a content-type heuristic to detect that case.
      properties:
        type:
          type: string
          enum:
            - channel.message
            - channel.typing
            - channel.text_delta
            - channel.tool_start
            - channel.tool_end
            - channel.thread_reply
            - channel.error
            - channel.done
            - no_active_stream
            - done
        channel:
          type: string
        message_id:
          type: integer
          format: int64
        thread_id:
          type: integer
          format: int64
        agent:
          type: string
        sender:
          type: string
        role:
          type: string
        content:
          type: string
        delta:
          type: string
        tool_call_id:
          type: string
          description: Set on `channel.tool_start` / `channel.tool_end`.
        tool_name:
          type: string
        arguments:
          type: object
          additionalProperties: true
        result:
          type: string
        duration_ms:
          type: integer
          format: int64
        error:
          type: string
        metrics:
          type: object
          additionalProperties: true

    # ── Files ─────────────────────────────────────────────────────────
    FileEntry:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
        is_dir:
          type: boolean
        size:
          type: integer
          format: int64
        mod_time:
          type: string
          format: date-time
        content_type:
          type: string

    FileContentResponse:
      type: object
      properties:
        path:
          type: string
        content_type:
          type: string
        content:
          type: string
          description: UTF-8 text or base64-encoded binary
        encoding:
          type: string
          enum: [utf-8, base64]
        size:
          type: integer
          format: int64

    FileMetadataResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceFile"
        agents:
          type: array
          items:
            type: string

    WorkspaceFile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
        agent:
          type: string
        process_id:
          type: string
        operation:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time

    # ── Schedules ─────────────────────────────────────────────────────
    ScheduledJob:
      type: object
      properties:
        name:
          type: string
        cron:
          type: string
        agent:
          type: string
        message:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    # Activity log — govega#33
    ActivityLogResponse:
      type: object
      required: [events, total, limit, offset]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/StoreEvent"
        total:
          type: integer
          description: Match count across the unpaginated filter — for FE pagination UI.
        limit:
          type: integer
        offset:
          type: integer

    StoreEvent:
      type: object
      required: [id, type, timestamp]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        process_id:
          type: string
        agent_name:
          type: string
        timestamp:
          type: string
          format: date-time
        data:
          type: string
        result:
          type: string
        error:
          type: string

    # Per-agent budget — govega#47
    AgentBudgetResponse:
      type: object
      required:
        - agent
        - soft_alert_threshold
        - enabled
        - observed_spend
        - period_start
        - period_end
      properties:
        agent:
          type: string
        budget_cap:
          type: number
          format: double
          nullable: true
          description: USD cap for the current period. null means no cap configured.
        soft_alert_threshold:
          type: number
          format: double
          description: Fraction of cap (0..1) that fires the soft-alert band on the FE.
        enabled:
          type: boolean
          description: Master switch — when false, the hard cutoff doesn't fire even if a cap is set.
        observed_spend:
          type: number
          format: double
          description: Sum of cost_usd across the latest snapshot of every process for the agent in the current period.
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time

    UpdateAgentBudgetRequest:
      type: object
      description: |
        Partial — omitted fields stay. Send `budget_cap: 0` to clear
        the cap. `soft_alert_threshold` must be in [0, 1].
      properties:
        budget_cap:
          type: number
          format: double
        soft_alert_threshold:
          type: number
          format: double
        enabled:
          type: boolean

    # Per-agent spend rollup — govega#47
    AgentSpend:
      type: object
      required: [agent, observed_spend, period, period_start, period_end]
      properties:
        agent:
          type: string
        observed_spend:
          type: number
          format: double
          description: Sum of cost_usd across the latest snapshot of every process for the agent in the period.
        period:
          type: string
          enum: [current, all]
        period_start:
          type: string
          format: date-time
          description: Zero value when period=all.
        period_end:
          type: string
          format: date-time
          description: Zero value when period=all.

    # Per-agent Brain attachments — govega#43
    BrainFile:
      type: object
      required: [id, agent_id, name, size_bytes, created_at]
      properties:
        id:
          type: string
          description: Server-generated stable id (`brain_<hex>`).
        agent_id:
          type: string
          description: Agent slug this file is attached to.
        name:
          type: string
          description: Original filename (path components stripped).
        mime_type:
          type: string
          description: From the upload header, or sniffed from content.
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    # Per-agent Routines — govega#52
    RoutineSchedule:
      type: object
      required: [frequency]
      properties:
        frequency:
          type: string
          enum: [daily, weekdays, weekly, biweekly, monthly, custom]
        time:
          type: string
          description: HH:mm (24h)
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
        timezone:
          type: string
          description: IANA timezone, e.g. America/New_York
        days_of_week:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
          description: 0=Sun … 6=Sat (weekly/biweekly)
        day_of_month:
          type: integer
          minimum: 1
          maximum: 31
          nullable: true
        cron:
          type: string
          description: |
            When `frequency=custom`, the raw cron expression supplied by
            the caller. Always returned on read as the derived expression
            for debugging.

    AgentRoutine:
      type: object
      required: [id, agent, title, instructions, schedule, cron, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          description: Server-generated stable id. For legacy DSL-created jobs falls back to `name`.
        agent:
          type: string
        title:
          type: string
        instructions:
          type: string
          description: Message sent to the agent on each fire.
        schedule:
          $ref: "#/components/schemas/RoutineSchedule"
        cron:
          type: string
          description: Derived cron expression (CRON_TZ-prefixed for non-custom frequencies).
        enabled:
          type: boolean
        last_run_at:
          type: string
          format: date-time
          nullable: true
        next_run_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRoutineRequest:
      type: object
      required: [title, instructions, schedule]
      properties:
        title:
          type: string
        instructions:
          type: string
        schedule:
          $ref: "#/components/schemas/RoutineSchedule"
        enabled:
          type: boolean
          description: Defaults to true.

    UpdateRoutineRequest:
      type: object
      properties:
        title:
          type: string
        instructions:
          type: string
        schedule:
          $ref: "#/components/schemas/RoutineSchedule"
        enabled:
          type: boolean

    # ── Inbox ─────────────────────────────────────────────────────────
    InboxItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        from_agent:
          type: string
        subject:
          type: string
        body:
          type: string
        priority:
          type: string
        status:
          type: string
        resolution:
          type: string
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        triage_count:
          type: integer
          description: Number of times the orchestrator's list_inbox tool has seen this item; auto-ages at threshold.
        last_triaged_at:
          type: string
          format: date-time

    # ── Tasks ─────────────────────────────────────────────────────────
    Task:
      type: object
      required: [id, title, status, priority, created_at, updated_at]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, doing, blocked, done, canceled]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        assignee:
          type: string
          description: Agent name; empty string means the task is in the orchestrator's routing queue
        tags:
          type: string
          description: Comma-separated tag list
        created_by:
          type: string
          description: '"user" if created via REST/UI, agent name if filed by an agent'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        due_at:
          type: string
          format: date-time

    TaskComment:
      type: object
      required: [id, task_id, content, created_at]
      properties:
        id:
          type: integer
          format: int64
        task_id:
          type: string
        author:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time

    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [comments, processes]
          properties:
            comments:
              type: array
              items:
                $ref: "#/components/schemas/TaskComment"
            processes:
              type: array
              items:
                type: string
              description: Process IDs linked to this task (oldest first)

    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, doing, blocked, done, canceled]
          description: Defaults to todo
        priority:
          type: string
          enum: [low, normal, high, urgent]
          description: Defaults to normal
        assignee:
          type: string
          description: Agent name; leave empty for orchestrator routing
        tags:
          type: string
        created_by:
          type: string
          description: Defaults to "user"
        due_at:
          type: string
          format: date-time

    UpdateTaskRequest:
      type: object
      description: Partial update — include only the fields you want to change
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, doing, blocked, done, canceled]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        assignee:
          type: string
        tags:
          type: string
        due_at:
          type: string
          format: date-time

    AddTaskCommentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
        author:
          type: string
          description: Defaults to "user"

    LinkTaskProcessRequest:
      type: object
      required: [process_id]
      properties:
        process_id:
          type: string

    # ── Settings ──────────────────────────────────────────────────────
    Setting:
      type: object
      required: [key]
      properties:
        key:
          type: string
        value:
          type: string
        sensitive:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Prompt History ────────────────────────────────────────────────
    PromptHistoryItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        prompt:
          type: string
        created_at:
          type: string
          format: date-time

    # ── SSE Events ────────────────────────────────────────────────────
    BrokerEvent:
      type: object
      properties:
        type:
          type: string
        process_id:
          type: string
        agent:
          type: string
        data:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time

    # ── Identity / Config ─────────────────────────────────────────────
    AgentIdentity:
      type: object
      required: [id, display_name]
      properties:
        id:
          type: string
        display_name:
          type: string
        title:
          type: string

    IdentityResponse:
      type: object
      required: [orchestrator, builder, product_name]
      properties:
        orchestrator:
          $ref: "#/components/schemas/AgentIdentity"
        builder:
          $ref: "#/components/schemas/AgentIdentity"
        product_name:
          type: string

    # Tenant config — govega#32 item B
    TenantConfigResponse:
      type: object
      required: [orchestrator_name, orchestrator_display, orchestrator_title]
      properties:
        orchestrator_name:
          type: string
          description: Lowercase slug used for routing.
        orchestrator_display:
          type: string
          description: Capitalized display name shown in the UI.
        orchestrator_title:
          type: string
          description: Role label (e.g. "Orchestrator", "Chief of Staff").
        product_name:
          type: string
          description: Product / universe name (e.g. "Apex", "Vega").
        accent_color:
          type: string
          description: Hex color (e.g. "#3B82F6") for the FE accent.
        logo_url:
          type: string

    UpdateTenantConfigRequest:
      type: object
      description: |
        Partial — omitted fields stay. Pointer-typed in Go; in JSON,
        omitting a key leaves it unchanged.
      properties:
        orchestrator_name:
          type: string
        orchestrator_display:
          type: string
        orchestrator_title:
          type: string
        accent_color:
          type: string
        logo_url:
          type: string

    ConfigAgentInfo:
      type: object
      required: [name, model, source]
      properties:
        name:
          type: string
        display_name:
          type: string
        model:
          type: string
        tools:
          type: array
          items:
            type: string
        team:
          type: array
          items:
            type: string
        source:
          type: string
          enum: [yaml, composed, builtin]

    ConfigMCPInfo:
      type: object
      required: [name, connected]
      properties:
        name:
          type: string
        connected:
          type: boolean
        transport:
          type: string

    ConfigSettingsInfo:
      type: object
      properties:
        default_model:
          type: string

    ConfigResponse:
      type: object
      required: [name, agents, mcp_servers]
      properties:
        name:
          type: string
        description:
          type: string
        agents:
          type: array
          items:
            $ref: "#/components/schemas/ConfigAgentInfo"
        mcp_servers:
          type: array
          items:
            $ref: "#/components/schemas/ConfigMCPInfo"
        settings:
          $ref: "#/components/schemas/ConfigSettingsInfo"

    ConfigUploadResult:
      type: object
      properties:
        name:
          type: string
        agents_created:
          type: array
          items:
            type: string
        agents_updated:
          type: array
          items:
            type: string
        agents_skipped:
          type: array
          items:
            type: string
        mcp_connected:
          type: array
          items:
            type: string
        mcp_failed:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string

    # ── Integrations ──────────────────────────────────────────────────
    TelegramBotStatus:
      type: object
      required: [id, agent, running]
      properties:
        id:
          type: string
        label:
          type: string
        agent:
          type: string
        running:
          type: boolean

    TelegramConfigureRequest:
      type: object
      required: [token, agent]
      properties:
        token:
          type: string
          description: Bot token from @BotFather
        agent:
          type: string
          description: Agent name to bind the bot to (defaults to orchestrator)
        label:
          type: string

    GmailStatus:
      type: object
      required: [connected, has_client_id, has_client_secret, has_refresh_token]
      properties:
        connected:
          type: boolean
        has_client_id:
          type: boolean
        has_client_secret:
          type: boolean
        has_refresh_token:
          type: boolean

    GmailConfigureRequest:
      type: object
      required: [client_id, client_secret, refresh_token]
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        refresh_token:
          type: string

    # ── Integrations: brokered catalog ────────────────────────────────
    IntegrationResponse:
      type: object
      required: [id, name, connections]
      properties:
        id:
          type: string
          description: Toolkit slug, e.g. "slack"
        name:
          type: string
        description:
          type: string
        icon_url:
          type: string
        category:
          type: string
          description: Catalog grouping, e.g. "communication", "dev_tools"
        is_popular:
          type: boolean
        connections:
          type: array
          description: Connected accounts on this toolkit. Empty = not connected.
          items:
            $ref: "#/components/schemas/IntegrationConnectionResponse"

    IntegrationConnectionResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          description: Connection id (provider connected-account id, e.g. "ca_…")
        account_label:
          type: string
          nullable: true
          description: |
            Human label for the account (e.g. "Brandcave"), as reported by
            the provider. Null until known. Also surfaced on per-agent
            tools as AgentTool.account_label.
        status:
          type: string
          enum: [pending, active, expired]
          description: |
            pending = consent flow started but not completed;
            expired = provider-side token refresh failed, reconnect required
        connected_at:
          type: string
          format: date-time
          nullable: true

    ConnectIntegrationRequest:
      type: object
      required: [callback_url]
      properties:
        callback_url:
          type: string
          format: uri
          description: |
            Where the provider sends the user after consent. The backend
            appends ?connected=<toolkit>&status=success|denied (or & when
            the URL already has a query string).

    ConnectIntegrationResponse:
      type: object
      required: [redirect_url]
      properties:
        redirect_url:
          type: string
          format: uri
          description: Hosted consent URL the SPA navigates the browser to
