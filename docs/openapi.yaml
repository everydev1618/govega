  # ── Per-agent tool toggle — govega#44 ───────────────────────────────
  /api/v1/agents/{name}/tools/{tool}:
    patch:
      tags: [Agents]
      summary: Enable or disable one tool for an agent
      description: |
        Single-tool granularity so the FE can flip one toggle without a
        read-modify-write of the full tools array racing against a
        sibling toggle. Idempotent — toggling to the current state
        returns 200 with the unchanged tool list.
      operationId: toggleAgentTool
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: tool
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated tool list
          content:
            application/json:
              schema:
                type: object
                required: [name, tools]
                properties:
                  name:
                    type: string
                  tools:
                    type: array
                    items: { type: string }
        "403":
          description: Builder meta-agent — tools cannot be mutated.
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Activity log — govega#33 ────────────────────────────────────────
  /api/v1/activity:
    get:
      tags: [System]
      summary: Searchable activity log
      description: |
        Queryable view over the persisted `events` table. The /events
        SSE stream is unfiltered and live-only; this endpoint is for
        retracing history when something goes wrong — full-text search
        across event type, agent name, data, result, error; time range
        + per-agent + per-type filters; pagination; CSV export for
        audit (`format=csv`).
      operationId: searchActivity
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring against type/agent/data/result/error.
        - name: type
          in: query
          required: false
          schema: { type: string }
          description: Exact event-type filter (e.g. `process.failed`).
        - name: agent
          in: query
          required: false
          schema: { type: string }
          description: Exact agent-name filter.
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: RFC 3339 inclusive lower bound on timestamp.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: RFC 3339 exclusive upper bound on timestamp.
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100, maximum: 500 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        "200":
          description: Page of matching events (JSON) or CSV download.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityLogResponse"
            text/csv:
              schema:
                type: string
                format: binary

  # ── Per-agent budget cap + enforcement — govega#47 ─────────────────
  /api/v1/agents/{name}/budget:
    get:
      tags: [Agents]
      summary: Read the agent's budget cap + current-period spend
      description: |
        Composes the persisted cap, threshold, and enabled state with a
        fresh observed_spend rollup over the current calendar-month UTC
        period. Returns a default-shaped record (no cap, threshold 0.8,
        disabled) for agents without a row.
      operationId: getAgentBudget
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Budget state + observed spend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBudgetResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Agents]
      summary: Set / clear the agent's budget cap
      description: |
        Partial — omitted fields stay. Send `budget_cap: 0` to clear
        the cap (FE convention; null pointer can't be distinguished
        from omission in JSON). `enabled` is the master switch — when
        false, the hard cutoff doesn't fire even if the cap is set.
        `soft_alert_threshold` must be between 0 and 1 (fraction of
        cap).

        When `observed_spend >= budget_cap AND enabled AND cap != null`,
        the chat handlers refuse subsequent turns with a canned
        "spending limit reached" assistant message. In-flight turns
        aren't interrupted.
      operationId: updateAgentBudget
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentBudgetRequest"
      responses:
        "200":
          description: Updated budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBudgetResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Per-agent spend rollup — govega#47 ──────────────────────────────
  /api/v1/agents/{name}/spend:
    get:
      tags: [Agents]
      summary: Observed spend rollup for one agent
      description: |
        Server-aggregated cost_usd across the latest snapshot of every
        process for the agent. Lets the FE render the observed_spend
        column without fanning out /api/v1/processes per agent
        (O(processes) per pageview).

        `period=current` (default) is the current calendar month UTC.
        `period=all` returns lifetime spend.
      operationId: getAgentSpend
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [current, all]
            default: current
      responses:
        "200":
          description: Spend rollup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSpend"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Per-agent Brain (knowledge attachments) — govega#43 ─────────────
  /api/v1/agents/{name}/brain:
    get:
      tags: [Agents]
      summary: List brain files attached to an agent
      operationId: listAgentBrain
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Array of BrainFile metadata (no content)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrainFile"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Agents]
      summary: Upload a brain file to an agent
      description: |
        Multipart upload (field name `file`). 10 MB per-file limit, 100 MB
        per-agent total. Mime type is taken from the multipart header
        when present, otherwise sniffed from the bytes.
      operationId: uploadAgentBrain
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrainFile"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: File or per-agent total exceeds the storage cap

  /api/v1/agents/{name}/brain/{file_id}:
    get:
      tags: [Agents]
      summary: Download a brain file
      operationId: getAgentBrainFile
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: file_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File contents
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Agents]
      summary: Delete a brain file
      operationId: deleteAgentBrainFile
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: file_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

